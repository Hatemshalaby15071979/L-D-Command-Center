name: Build Windows LDCC
description: >-
  Shared PyInstaller build + Authenticode signing + build manifest + windowed
  smoke for L&D Command Center. Extracted from windows-build.yml and
  release.yml so the build/sign/gate logic lives in exactly one place
  (shipment-readiness refactor, B5). Runs INSIDE the caller's job, so the
  produced dist/ is visible to the caller's post-steps (artifact upload /
  GitHub Release creation).

# Composite actions cannot reference the `secrets` context directly (the
# loader rejects it). Signing secrets are passed in as inputs by the caller,
# which is allowed to read `secrets.*` in its `with:` block.
inputs:
  sign_pfx_base64:
    description: "Base64-encoded Authenticode PFX (optional; unsigned build if empty)."
    required: false
  sign_pfx_password:
    description: "PFX password (optional)."
    required: false

runs:
  using: composite
  steps:
    - name: Set up Python (build baseline 3.10)
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install project dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Install PyInstaller (pinned to local baseline)
      shell: bash
      run: python -m pip install pyinstaller==6.22.2

    - name: Offline suite gate
      shell: bash
      run: python -m pytest -q

    - name: Secrets/artifacts policy gate
      shell: bash
      run: python desktop_shell/check_deployment_policy.py

    - name: PyInstaller build (windowed)
      shell: bash
      run: >-
        python -m PyInstaller desktop_shell/ldcc.spec
        --noconfirm --distpath dist --workpath build/release_work

    # Must run BEFORE the manifest: signing rewrites the PE, so a hash
    # computed earlier would not match the shipped binary.
    # Exits 3 when no certificate is configured; that is a pass, not a failure.
    - name: Sign executable
      shell: pwsh
      env:
        LDCC_SIGN_PFX_BASE64: ${{ inputs.sign_pfx_base64 }}
        LDCC_SIGN_PFX_PASSWORD: ${{ inputs.sign_pfx_password }}
      run: |
        & ./desktop_shell/sign_build.ps1 -ExePath dist/ldcc.exe
        $code = $LASTEXITCODE
        if ($code -eq 3) {
          Write-Host "::notice::No signing certificate configured - this build ships unsigned."
          exit 0
        }
        exit $code

    - name: Write build manifest
      shell: bash
      run: python desktop_shell/write_build_manifest.py dist/ldcc.exe

    - name: Windowed-launch smoke gate
      shell: pwsh
      run: >-
        powershell -NoProfile -ExecutionPolicy Bypass
        -File desktop_shell/verify_build.ps1 -ExePath dist/ldcc.exe
