name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q desktop_shell engines model-layer storage

      - name: Run offline test suite with coverage floor (exit E7 gate)
        run: |
          python -m pytest -q -m "not live" \
            --cov=engines --cov=model-layer --cov=storage --cov=desktop_shell \
            --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=90

      - name: Generate Flake8 report (advisory)
        continue-on-error: true
        run: |
          python -m pip install flake8
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics
