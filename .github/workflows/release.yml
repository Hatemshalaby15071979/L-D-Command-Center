name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Human-approval gate: this environment must have at least one reviewer
    # configured in repository Settings -> Environments -> release.
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (build baseline 3.10)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install PyInstaller (pinned to local baseline)
        run: python -m pip install pyinstaller==6.22.2

      - name: Offline suite gate
        run: python -m pytest -q

      - name: Secrets/artifacts policy gate
        run: python desktop_shell\check_deployment_policy.py

      - name: PyInstaller build (windowed)
        run: python -m PyInstaller desktop_shell\ldcc.spec --noconfirm --distpath dist --workpath build\release_work

      # Must run BEFORE the manifest: signing rewrites the PE, so a hash
      # computed earlier would not match the shipped binary.
      - name: Sign executable
        shell: pwsh
        env:
          LDCC_SIGN_PFX_BASE64: ${{ secrets.LDCC_SIGN_PFX_BASE64 }}
          LDCC_SIGN_PFX_PASSWORD: ${{ secrets.LDCC_SIGN_PFX_PASSWORD }}
        run: |
          & ./desktop_shell/sign_build.ps1 -ExePath dist/ldcc.exe
          $code = $LASTEXITCODE
          if ($code -eq 3) {
            Write-Host "::warning::No signing certificate configured - publishing an UNSIGNED release."
            exit 0
          }
          exit $code

      - name: Write build manifest
        run: python desktop_shell\write_build_manifest.py dist\ldcc.exe

      - name: Windowed-launch smoke gate
        run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop_shell\verify_build.ps1 -ExePath dist\ldcc.exe

      - name: Read signing status
        id: sign
        shell: pwsh
        run: |
          $record = Get-Content dist/ldcc-signature.json -Raw | ConvertFrom-Json
          "status=$($record.status)" >> $env:GITHUB_OUTPUT
          if ($record.status -eq "signed") {
            "note=Signed by $($record.subject)." >> $env:GITHUB_OUTPUT
          } else {
            "note=This build is UNSIGNED. Windows will show 'Unknown publisher' - verify the SHA-256 against ldcc-build.json before running." >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGN_NOTE: ${{ steps.sign.outputs.note }}
        run: |
          $tag = "v$((Get-Date -Format 'yyyyMMdd-HHmmss'))"
          gh release create $tag "dist/ldcc.exe" "dist/ldcc-build.json" "dist/ldcc-build.txt" "dist/ldcc-signature.json" --title "ldcc $tag" --notes "$env:SIGN_NOTE`n`nVerify sha256 against dist/ldcc-build.json in the release assets."