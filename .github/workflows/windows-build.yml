name: Windows release build

on:
  push:
    branches: ["main"]
    paths:
      - "desktop_shell/**"
      - "requirements.txt"
      - ".github/workflows/windows-build.yml"
      - ".github/actions/build-windows/action.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "desktop_shell/**"
      - "requirements.txt"
      - ".github/workflows/windows-build.yml"
      - ".github/actions/build-windows/action.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, sign, manifest, smoke (shared)
        uses: ./.github/actions/build-windows
        with:
          sign_pfx_base64: ${{ secrets.LDCC_SIGN_PFX_BASE64 }}
          sign_pfx_password: ${{ secrets.LDCC_SIGN_PFX_PASSWORD }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: ldcc-windows-dist
          path: |
            dist/ldcc.exe
            dist/ldcc-build.json
            dist/ldcc-build.txt
            dist/ldcc-signature.json
          if-no-files-found: error
          retention-days: 60
